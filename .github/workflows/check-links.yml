name: Check website links
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - name: Check links in site pages
        uses: lycheeverse/lychee-action@v2
        with:
          # TurkNet returns 403 to the runner. The StarSat redirect serves an APK.
          # Check these destinations separately from the CI crawler.
          args: --exclude '^https://www\.turk\.net/' --exclude '^https://biif\.uk/download/starsat-plus$' --root-dir "$GITHUB_WORKSPACE" --no-progress --max-retries 1 --timeout 20 './**/*.html'
          fail: true
          jobSummary: true
