name: Weekly website backup

on:
  schedule:
    - cron: '41 6 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Archive published source files
        shell: bash
        run: |
          tar --exclude=.git --exclude=.github -czf "${RUNNER_TEMP}/turknet-live-source.tar.gz" .
          echo "Backup archive created"
      - name: Save backup as GitHub Actions artifact
        uses: actions/upload-artifact@v7
        with:
          name: turknet-live-backup-${{ github.run_number }}
          path: ${{ runner.temp }}/turknet-live-source.tar.gz
          retention-days: 30
          if-no-files-found: error
